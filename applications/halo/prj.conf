# Zephyr Project Configuration File

# Zephyr Base Configuration
CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=3
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Log Filesystem Backend — persist logs to LittleFS. DISABLED on this
# branch: littlefs writes hit the same flash the code executes from, so
# every persisted log line (e.g. the AEC's 10-s load INF) stalls the
# whole system mid-audio-session — the same mechanism as the /lfs
# capture-write emission gaps the AEC harnesses had to design around.
# Also returns the 2x16KB log files to /lfs. Re-enable when the audio
# timing work no longer needs stall-free sessions (the `logs` skill
# depends on it for post-flash diagnostics; `verify.py` still covers
# boot checks).
CONFIG_LOG_BACKEND_FS=n
# CONFIG_LOG_BACKEND_FS_DIR="/lfs"
# CONFIG_LOG_BACKEND_FS_AUTOSTART=y
# CONFIG_LOG_BACKEND_FS_OVERWRITE=y
# CONFIG_LOG_BACKEND_FS_FILE_PREFIX="log."
# CONFIG_LOG_BACKEND_FS_FILE_SIZE=16384
# CONFIG_LOG_BACKEND_FS_FILES_LIMIT=2

# System Workqueue Configuration
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
CONFIG_PRIVILEGED_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Power Management Configuration
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Thread Monitoring and Debugging
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y


# Halo Framework
CONFIG_HALO=y
# Acoustic echo cancellation (speaker leakage removed from the mic path)
CONFIG_HALO_AUDIO_AEC=y
CONFIG_HALO_AUDIO_AEC_TAPS=1024
CONFIG_MPIX_LOG_LEVEL_WRN=y
CONFIG_FS_LOG_LEVEL_WRN=y

# Memory Manager Configuration
# The libc malloc arena defaults to "all RAM left after static allocations",
# which had decayed to ~50 bytes - any .bss growth then fails the sys_heap
# minimum-size assert in malloc_prepare() and the image panics at boot.
# Pin the arena explicitly and give back one page from the internal pool so
# the link keeps real headroom.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2048
# (also funds the AEC's 256ms reference ring and its ~3.3KB paired-capture
# snapshot buffers - see audio_aec.c)
CONFIG_HALO_MEM_INTERNAL_SIZE=352256
CONFIG_HALO_MEM_USE_EXTERNAL_SRAM=y
CONFIG_HALO_MEM_EXTERNAL_SRAM_ADDR=0x00000000
# The first 64KB of ITCM belong to the AEC FDAF state (the linker's ITCM
# section; BUILD_ASSERTed in audio_aec.c to fit below this offset) - the
# region-1 heap starts above it. Was offset 4096 (NULL guard) + 520192.
CONFIG_HALO_MEM_EXTERNAL_SRAM_OFFSET=65536
CONFIG_HALO_MEM_EXTERNAL_SRAM_SIZE=458752
CONFIG_HALO_MEM_MANAGER_STATS=y

# Flash and Storage Configuration
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# LittleFS Configuration
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y

# Settings Configuration
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings"

# Sensor Configuration for Battery Service
CONFIG_SENSOR=y
CONFIG_SENSOR_INIT_PRIORITY=60

# Regulator Init Priority
# cam_1v8 (regulator-fixed, priority 32) must initialize before tps65132
# (REGULATOR_TPS65132_COMMON_INIT_PRIORITY=61), since tps65132 has
# vin-supply = <&cam_1v8> and checks device_is_ready() during init.
CONFIG_REGULATOR_FIXED_INIT_PRIORITY=32

# LED Configuration for Battery Charging Indicator
CONFIG_PWM=y
CONFIG_LED_PWM=y

# Halo BLE Manager Configuration
CONFIG_HALO_BLE_MAX_SERVICES=8
CONFIG_HALO_BLE_BOND_STORAGE=y
CONFIG_HALO_BLE_REQUIRE_PAIRING=y
CONFIG_HALO_BLE_ALLOW_BOND_OVERWRITE=n


# BLE Lua Service Configuration
CONFIG_HALO_BLE_LUA_SERVICE=y
CONFIG_HALO_LUA_MAX_REPL_SIZE=1024
CONFIG_HALO_LUA_MAX_DATA_SIZE=4096
CONFIG_HALO_AUDIO_MAX_DATA_SIZE=8192
CONFIG_HALO_SFXR=y
CONFIG_HALO_LUA_SOUND=y
CONFIG_HALO_STARTUP_SOUND=y
CONFIG_HALO_STARTUP_SOUND_PRESET="powerup"
CONFIG_HALO_STARTUP_SOUND_SEED=4149902225
CONFIG_HALO_STARTUP_SOUND_DURATION_MS=1000
# Boot/shutdown cues play at the app-wide SFXR level (20).
CONFIG_HALO_STARTUP_SOUND_VOLUME=20
CONFIG_HALO_SHUTDOWN_SOUND=y
CONFIG_HALO_SHUTDOWN_SOUND_PRESET="laser"
CONFIG_HALO_SHUTDOWN_SOUND_SEED=573636714
CONFIG_HALO_SHUTDOWN_SOUND_DURATION_MS=700
CONFIG_HALO_SHUTDOWN_SOUND_VOLUME=20

# Boot logo splash (drawn pre-runtime_init, held for the startup sound duration)
CONFIG_HALO_BOOT_LOGO=y

# Lua Runtime Configuration
CONFIG_HALO_LUA_RUNTIME=y
# REPL thread: 128KB stack for Lua VM and complex user scripts
CONFIG_HALO_LUA_REPL_TASK_STACK_SIZE=65536
CONFIG_HALO_LUA_REPL_TASK_PRIORITY=7
# Data handler thread: 8KB stack for BLE data callbacks
CONFIG_HALO_LUA_DATA_TASK_STACK_SIZE=8192
CONFIG_HALO_LUA_DATA_TASK_PRIORITY=7

# Watchdog Configuration
CONFIG_HALO_WATCHDOG_MANAGER=y
CONFIG_HALO_WATCHDOG_TIMEOUT_MS=5000
CONFIG_HALO_WATCHDOG_ALLOW_CALLBACK=y
CONFIG_HALO_WATCHDOG_AUTO_FEED=y
CONFIG_HALO_WATCHDOG_AUTO_FEED_PRIORITY=2
CONFIG_HALO_WATCHDOG_AUTO_FEED_STACK_SIZE=512
CONFIG_HALO_WATCHDOG_FEED_INTERVAL_MS=1000

CONFIG_HALO_BLE_MANAGER=y

CONFIG_HALO_SE_MGMT=y

CONFIG_BOOT_BANNER=n


CONFIG_HALO_BATTERY_MANAGER=y
CONFIG_HALO_LED_MANAGER=y
CONFIG_HALO_WATCHDOG_MANAGER=y
CONFIG_HALO_LUA_RUNTIME=y
CONFIG_HALO_BLE_ALLOW_BOND_OVERWRITE=n

CONFIG_HALO_BLE_AUDIO_SERVICE=y
CONFIG_HALO_BLE_AUDIO_SINK_ENABLE=y
CONFIG_HALO_BLE_AUDIO_OUTPUT_STEREO=y
CONFIG_HALO_BLE_AUDIO_SOURCE_ENABLE=y
CONFIG_HALO_BLE_AUDIO_INPUT_STEREO=n

# Set a current budget for the speakers to avoid tripping the battery protection IC
CONFIG_MAX98357A_AUDIO_PROTECT_BUDGET_PERCENT=80

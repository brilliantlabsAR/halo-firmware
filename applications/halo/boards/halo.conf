

# FLASH 
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_RESET=y
CONFIG_I2C=y
CONFIG_I2C_DW=y
CONFIG_I2C_DW_CLOCK_SPEED=40
# Counter
CONFIG_COUNTER=y
CONFIG_COUNTER_RTC_SNPS_DW=y
CONFIG_COUNTER_SNPS_DW=y


# BLE 
CONFIG_BT=y
CONFIG_BT_CUSTOM=y
CONFIG_ALIF_BLE_HOST_THREAD_PRIORITY=1
CONFIG_ALIF_BLE_HOST_THREAD_STACKSIZE=10240
CONFIG_ALIF_BLE_HOST_ADDL_PRF_HEAPSIZE=10240
CONFIG_ALIF_BLE_HOST_ADDL_ENV_HEAPSIZE=8192

# Display
CONFIG_DISPLAY=y
CONFIG_CDC200=y
CONFIG_MIPI_DSI=y
CONFIG_CANVAS=y
CONFIG_FB_USES_DTCM_REGION=y

# Sensors
CONFIG_BMA580_TRIGGER_OWN_THREAD=y

# Camera
CONFIG_VIDEO=y
CONFIG_VIDEO_MIPI_CSI2_DW=n
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=1
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=327680
CONFIG_FB_USES_DTCM_REGION=y
CONFIG_MPIX=y
CONFIG_MPIX_HEAP_SIZE=81920

#Audio
CONFIG_AUDIO=y
CONFIG_I2S=y
CONFIG_MAX98357A_AUDIO=y
CONFIG_MAX98357A_AUDIO_GENERIC_API=y
CONFIG_MAX98357A_AUDIO_SYNC_BLOCK_SIZE=640
CONFIG_MAX98357A_AUDIO_SYNC_BLOCK_COUNT=8
CONFIG_AUDIO_DMIC=y
CONFIG_ALIF_BLE_AUDIO=n
CONFIG_ALIF_ROM_LC3_CODEC=y
CONFIG_T5838_AAD_TRIGGER_OWN_THREAD=y

CONFIG_SOC_B1_DCDC_VOLTAGE=775
CONFIG_SE_SERVICE_INIT_PRIORITY=1
CONFIG_KERNEL_INIT_PRIORITY_DEFAULT=0
CONFIG_GPIO_INIT_PRIORITY=40

CONFIG_ALIF_MAX_SLEEP_CLOCK_DRIFT=252
CONFIG_ALIF_MAX_ACTIVE_CLOCK_DRIFT=252

CONFIG_CORTEX_M_SYSTICK_IDLE_TIMER=y

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_SERIAL_INIT_PRIORITY=40
CONFIG_CONSOLE_INIT_PRIORITY=42
description: PAG7982 CMOS video sensor

compatible: "pixart,pag7982"

properties:
  power-gpios:
    type: phandle-array
    description: |
      The power pin is asserted to enable the sensor. 

  reset-gpios:
    type: phandle-array
    description: |
      The RESETn pin is asserted to disable the sensor causing a hard
      reset.  The sensor receives this as an active-low signal.

  pixclk:
    type: int
    description: Pixel clock frequency in Hz.
  
  frame-rate:
    type: int
    description: Frame rate in Hz.

  lazy-init:
    type: boolean
    description: |
      If enabled, hardware initialization is deferred until first use (PM resume).
      This saves boot time and power consumption when display is not immediately needed.
      When false, hardware is initialized during driver init.

include: i2c-device.yaml


compatible: "alif,i2s-sync"

description: Alif I2S driver with synchronisation

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  bit-depth:
    type: int
    description: Number of bits per sample
    required: true
    enum:
      - 16

  sample-rate:
    type: int
    description: Rate at which samples are clocked in/out over the I2S bus
    required: true

  mono-mode:
    type: boolean
    description: |
      Start the bus in mono: each sample is sent in both the left and right
      slots. This is only the default; a stream can switch to stereo (one
      sample per slot) at runtime with i2s_sync_configure().

CONFIG_I2C_DW=y
CONFIG_I2C_TARGET=y
CONFIG_I2C=y
CONFIG_I2C_DW_CLOCK_SPEED=40

# Flash layout
CONFIG_XIP=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_HEAP_MEM_POOL_SIZE=65536

#Microphone & Speaker
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_MAX98357A_AUDIO=y
CONFIG_MAX98357A_AUDIO_GENERIC_API=y
CONFIG_T5838_AAD_TRIGGER=y

#Display
CONFIG_DISPLAY=y
CONFIG_CDC200=y
CONFIG_MIPI_DSI=y
CONFIG_CANVAS=y
CONFIG_FB_USES_DTCM_REGION=y

# LED
CONFIG_PWM=y
CONFIG_LED_PWM=y
CONFIG_LED_INIT_PRIORITY=50

# Camera
CONFIG_VIDEO=y
CONFIG_VIDEO_MIPI_CSI2_DW=n
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=1
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=327680
CONFIG_FB_USES_DTCM_REGION=y
CONFIG_MPIX=y
CONFIG_MPIX_HEAP_SIZE=65536

# BLE
CONFIG_BT=y
CONFIG_BT_CUSTOM=y

# Halo main-board factory test: lean on purpose. It is written over SE-UART at
# ~15 KB/s on every board, so every KB costs station time.

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Console and shell at the board default (115200). FT lines are the interface,
# so no colours or prompt tricks that a parser would have to strip.
CONFIG_SHELL=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_VT100_COMMANDS=n
# No prompt: FT lines from the boot run must start at column 0
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_HISTORY=n
CONFIG_I2C_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_PM_DEVICE=y
CONFIG_CRC=y

# LFXO-driven low-power RTC, read against the CPU cycle counter
CONFIG_COUNTER=y
CONFIG_COUNTER_RTC_SNPS_DW=y

# MRAM write/read-back in the slot1 partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# PDM microphone
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# BLE advertiser for the station's scan check
CONFIG_BT=y
CONFIG_BT_CUSTOM=y

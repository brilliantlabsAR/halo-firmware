sample:
  name: Ship Mode Sample
  description: Shutdown device into ultra-low power ship mode

tests:
  sample.halo.shipmode:
    harness: console
    tags:
      - gpio
      - power
      - shipmode
    platform_allow:
      - halo
    integration_platforms:
      - halo
    depends_on:
      - gpio
    filter: dt_alias_exists("shutdown")
    harness_config:
      type: multi_line
      regex:
        - "Ship Mode Sample"
        - "Shutdown in"
        - "Shutting down now"

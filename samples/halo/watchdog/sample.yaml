sample:
  name: Watchdog Driver Sample
common:
  tags:
    - drivers
    - watchdog
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "Watchdog sample application"
      - "Feeding watchdog..."
      - "Waiting for reset..."
      - "Handled things..ready to reset"
  depends_on: watchdog
tests:
  sample.drivers.watchdog:
    platform_allow: halo

# Logging configuration
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_PRINTK=y

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# GPIO and Input configuration
CONFIG_GPIO=y
CONFIG_INPUT=y

# Button driver configuration
CONFIG_INPUT_GPIO_BUTTON=y
CONFIG_INPUT_GPIO_BUTTON_GLOBAL_THREAD=y

# Console and serial
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# System configuration
CONFIG_HEAP_MEM_POOL_SIZE=2048
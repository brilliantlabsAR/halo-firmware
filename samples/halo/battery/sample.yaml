sample:
  name: Battery Voltage Monitoring
  description: Battery voltage and state-of-charge monitoring using ADC and resistor divider
tests:
  sample.halo.battery:
    platform_allow:
      - halo
    integration_platforms:
      - halo
    tags:
      - sensor
      - battery
      - adc
      - power
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "Voltage: (\\d+)mV, SoC: (\\d+)%, Charge Status: (\\d)"
      ordered: false
